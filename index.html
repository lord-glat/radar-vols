<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de vols</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bar: 56px; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #0e1a24; color: #e8f0f5; }
  #map { position: absolute; inset: 0 0 var(--bar) 0; background: #0e1a24; }
  #status { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: #0e1a24ee; padding: 6px 14px; border-radius: 6px; font-size: 13px; max-width: 86vw; text-align: center; box-sizing: border-box; }
  #info { position: absolute; left: 0; right: 0; bottom: var(--bar); z-index: 1000; display: none;
          background: #0e1a24f5; border-top: 2px solid #f2c14e; padding: 12px 16px 16px; }
  #info h2 { margin: 0 0 8px; font-size: 20px; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  #info dt { color: #8fa6b5; }
  #info dd { margin: 0; }
  #close { position: absolute; top: 8px; right: 12px; background: none; border: 0; color: #e8f0f5; font-size: 26px; cursor: pointer; }
  #close:focus-visible { outline: 2px solid #f2c14e; }
  .plane { transition: transform 0.4s linear; }
  #search { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; }
  #q { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border: 0; border-radius: 8px; background: #fff; color: #0e1a24; }
  #go { padding: 10px 16px; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; background: #f2c14e; color: #0e1a24; cursor: pointer; }
  #q:focus-visible, #go:focus-visible { outline: 2px solid #3d6fe0; }
  .leaflet-top { top: 104px; }
  #fbtn { padding: 10px 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; background: #dfe9f0; color: #0e1a24; cursor: pointer; }
  #filters { position: absolute; top: 104px; right: 10px; z-index: 1000; width: min(270px, 72vw); display: none;
             background: #0e1a24f5; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  #filters fieldset { border: 0; margin: 0 0 10px; padding: 0; }
  #filters legend { color: #8fa6b5; padding: 0; margin-bottom: 4px; }
  #filters label { display: block; padding: 3px 0; }
  #filters input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; border: 0; border-radius: 6px; margin-bottom: 8px; }
  #filters button { padding: 8px 12px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px; background: #f2c14e; color: #0e1a24; margin-right: 6px; cursor: pointer; }
  #fbtn:focus-visible, #filters button:focus-visible { outline: 2px solid #3d6fe0; }
  #filters #air-btn { display: block; width: 100%; margin: 0 0 8px; text-align: left; background: #fff; font-weight: 400; font-size: 16px; padding: 10px 8px; }
  #air-box { display: none; margin-bottom: 8px; background: #fff; border-radius: 6px; padding: 6px; }
  #air-q { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; border: 1px solid #c5d0d8; border-radius: 6px; margin-bottom: 4px; background: #fff; color: #0e1a24; }
  #air-list { max-height: 170px; overflow-y: auto; color: #0e1a24; }
  #filters #air-list button { display: block; width: 100%; margin: 0; text-align: left; background: none; font-weight: 400; font-size: 15px; padding: 8px; color: #0e1a24; }
  #filters #air-list button[aria-selected="true"] { background: #f2c14e; font-weight: 600; }
  #info { max-height: 50vh; overflow-y: auto; }
  #info p { margin: 0 0 8px; color: #8fa6b5; font-size: 14px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); z-index: 1100; display: grid;
         grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 0 10px; box-sizing: border-box;
         background: #0e1a24; border-top: 1px solid #24394a; }
  #bar button { padding: 10px 0; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: transparent; color: #8fa6b5; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #f2c14e; color: #0e1a24; }
  #bar button:focus-visible, #f-actions button:focus-visible { outline: 2px solid #3d6fe0; }
  #f-actions { margin-top: 10px; display: flex; gap: 8px; }
  #f-actions button { padding: 9px 14px; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; background: #f2c14e; color: #0e1a24; cursor: pointer; }
  #fc { display: none; }
  #fc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 36px; }
  #fc-call { font-size: 24px; font-weight: 700; color: #f2c14e; }
  .chip { background: #3a4a57; border-radius: 4px; padding: 2px 7px; font-size: 13px; font-weight: 700; }
  #fc-air { color: #c9d6df; margin: 2px 0 10px; }
  .fc-box { background: #1b2b38; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  #fc-route { display: flex; justify-content: space-between; align-items: center; }
  #fc-route div { display: flex; flex-direction: column; min-width: 90px; }
  #fc-route div.r { text-align: right; align-items: flex-end; }
  #fc-route b { font-size: 28px; line-height: 1.1; }
  #fc-route small { font-size: 12px; font-weight: 600; color: #c9d6df; text-transform: uppercase; }
  #fc-route > span { font-size: 22px; color: #f2c14e; }
  #fc-bar { height: 6px; border-radius: 3px; background: #3a4a57; margin: 10px 0 6px; overflow: hidden; }
  #fc-fill { height: 100%; width: 0; background: #f2c14e; }
  #fc-times { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #c9d6df; }
  #fc-stats { display: flex; gap: 8px; margin-bottom: 8px; }
  #fc-stats > div { flex: 1; background: #1b2b38; border-radius: 10px; padding: 8px 12px; }
  #fc-stats small { display: block; font-size: 11px; font-weight: 600; color: #8fa6b5; }
  #fc-stats b { font-size: 20px; }
  #fc-foot { display: flex; justify-content: space-between; background: #1b2b38; border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 600; }
  #chip { position: absolute; left: 10px; right: 10px; bottom: calc(var(--bar) + 10px); z-index: 1000; display: none;
          align-items: center; gap: 8px; background: #0e1a24f5; border: 1px solid #f2c14e; border-radius: 10px; padding: 8px 12px; }
  #chip span { flex: 1; font-weight: 600; }
  #chip button { padding: 8px 12px; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px; background: #f2c14e; color: #0e1a24; cursor: pointer; }
  #fc-diag { margin-top: 6px; font-size: 11px; color: #6f8696; }
  .plane svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition: transform .2s; }
  .leaflet-marker-icon.sel .plane svg { filter: drop-shadow(0 0 5px #f2c14e) drop-shadow(0 0 2px #f2c14e); transform: scale(1.35); }
  #info { border-top: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.4); }
  #status { border-radius: 999px; padding: 6px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #q, #go, #fbtn { box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #filters { max-height: calc(100vh - 240px); overflow-y: auto; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #bar button { min-height: 44px; }
  .dot { font-size: 12px; }
  #reg-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="search">
  <input id="q" type="search" placeholder="Vol (AFR123) ou immat. (F-GKXA)" autocapitalize="characters" autocomplete="off" aria-label="Rechercher un vol ou une immatriculation">
  <button id="go">Chercher</button>
  <button id="fbtn" aria-expanded="false" aria-controls="filters">Filtres</button>
</div>
<div id="filters">
  <fieldset>
    <legend>Altitude</legend>
    <label><input type="checkbox" id="flt-ground" checked> <span class="dot" style="color:#7d8b96">●</span> Au sol</label>
    <label><input type="checkbox" id="flt-low" checked> <span class="dot" style="color:#f2994a">●</span> Basse (moins de 10 000 ft)</label>
    <label><input type="checkbox" id="flt-mid" checked> <span class="dot" style="color:#1f9bb0">●</span> Moyenne (10 000 à 25 000 ft)</label>
    <label><input type="checkbox" id="flt-high" checked> <span class="dot" style="color:#3d6fe0">●</span> Haute (plus de 25 000 ft)</label>
  </fieldset>
  <fieldset>
    <legend>Régions (aucune cochée = zone visible sur la carte)</legend>
    <div id="reg-list"></div>
  </fieldset>
  <label for="air-btn">Compagnie</label>
  <button type="button" id="air-btn" aria-expanded="false" aria-controls="air-box">Toutes les compagnies ▾</button>
  <div id="air-box">
    <input type="search" id="air-q" placeholder="Rechercher une compagnie…" autocomplete="off" aria-label="Rechercher une compagnie">
    <div id="air-list"></div>
  </div>
  <label for="flt-type">Type d’appareil</label>
  <input type="text" id="flt-type" placeholder="A320, B738" autocapitalize="characters" autocomplete="off">
  <button id="flt-pos">Ma position</button><button id="flt-reset">Réinitialiser</button>
</div>
<div id="status">Chargement…</div>
<div id="info">
  <button id="close" aria-label="Fermer la fiche">×</button>
  <h2 id="f-call"></h2>
  <p id="f-sub"></p>
  <dl id="f-list"></dl>
  <div id="fc">
    <div id="fc-head"><span id="fc-call"></span><span class="chip" id="fc-iata"></span><span class="chip" id="fc-type"></span></div>
    <div id="fc-air"></div>
    <div class="fc-box">
      <div id="fc-route">
        <div><b id="fc-o">—</b><small id="fc-on"></small></div>
        <span aria-hidden="true">✈</span>
        <div class="r"><b id="fc-d">—</b><small id="fc-dn"></small></div>
      </div>
      <div id="fc-bar"><div id="fc-fill"></div></div>
      <div id="fc-times"><span id="fc-since"></span><span id="fc-eta"></span></div>
    </div>
    <div id="fc-stats">
      <div><small>ALT. BAROMÉTR.</small><b id="fc-alt"></b></div>
      <div><small>VITESSE SOL</small><b id="fc-spd"></b></div>
    </div>
    <div id="fc-foot"><span id="fc-model"></span><span id="fc-reg"></span></div>
    <div id="fc-diag"></div>
  </div>
  <div id="f-actions">
    <button id="f-follow">Suivre</button>
    <button id="f-share">Partager</button>
    <button id="f-center" style="display:none">Recentrer</button>
  </div>
</div>

<div id="chip">
  <span id="chip-text"></span>
  <button id="chip-open">Fiche</button>
  <button id="chip-stop">Arrêter</button>
</div>

<nav id="bar" aria-label="Navigation">
  <span></span>
  <button id="tab-map" aria-pressed="true">Carte</button>
  <button id="tab-route" aria-pressed="false">Itinéraire</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---------- Réglages ----------
  // Sources gratuites testées dans l’ordre : la première qui répond est utilisée
  const PROVIDERS = [
    { name: "adsb.lol", url: (la, lo, nm) => `https://api.adsb.lol/v2/lat/${la}/lon/${lo}/dist/${nm}` },
    { name: "airplanes.live", url: (la, lo, nm) => `https://api.airplanes.live/v2/point/${la}/${lo}/${nm}` },
    { name: "adsb.fi", url: (la, lo, nm) => `https://opendata.adsb.fi/api/v2/lat/${la}/lon/${lo}/dist/${nm}` },
    {
      name: "OpenSky",
      // OpenSky demande un rectangle (lat/lon min et max) au lieu d’un rayon
      url: (la, lo, nm) => {
        const dLat = nm / 60, dLon = nm / (60 * Math.max(Math.cos(la * Math.PI / 180), 0.2));
        return `https://opensky-network.org/api/states/all?lamin=${(la - dLat).toFixed(3)}&lomin=${(lo - dLon).toFixed(3)}&lamax=${(+la + dLat).toFixed(3)}&lomax=${(+lo + dLon).toFixed(3)}`;
      },
      // Convertit le format OpenSky (mètres, m/s) vers le nôtre (pieds, nœuds)
      parse: (d) => (d.states || []).map((s) => ({
        hex: s[0], flight: s[1], lon: s[5], lat: s[6],
        alt_baro: s[8] ? "ground" : (typeof s[7] === "number" ? Math.round(s[7] * 3.28084) : null),
        gs: typeof s[9] === "number" ? s[9] * 1.94384 : null,
        track: s[10]
      }))
    }
  ];
  let current = 0;
  // Adresse de votre relais Cloudflare (laissez vide tant que vous n’en avez pas)
  // Exemple : "https://radar-relais.votrenom.workers.dev/"
  const PROXY = "https://radar-relais.glatignyhugo.workers.dev/";
  const REFRESH_MS = 10000;                 // rafraîchissement toutes les 10 s
  const MAX_NM = 250;                       // rayon maximum accepté par l’API (milles nautiques)

  // ---------- Carte ----------
  const map = L.map("map", { worldCopyJump: true }).setView([46.6, 2.4], 7);
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap", maxZoom: 18
  }).addTo(map);

  const trailLine = L.polyline([], { color: "#f2c14e", weight: 2 }).addTo(map);
  const planes = new Map();   // hex -> { marker, trail, ac }
  let selected = null;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  function setStatus(text) { $("status").textContent = text; }

  // Couleur selon l’altitude (en pieds)
  function altColor(alt) {
    if (alt === "ground" || alt == null) return "#7d8b96";
    if (alt < 10000) return "#f2994a";
    if (alt < 25000) return "#1f9bb0";
    return "#3d6fe0";
  }

  function planeIcon(ac) {
    const rot = Math.round(ac.track ?? 0);
    const html =
      `<div class="plane" style="transform:rotate(${rot}deg)">` +
      `<svg viewBox="0 0 24 24" width="26" height="26">` +
      `<path d="M12 2l2 7 8 4v2l-8-2-1 5 3 2v2l-4-1-4 1v-2l3-2-1-5-8 2v-2l8-4z" ` +
      `fill="${altColor(ac.alt_baro)}" stroke="#0e1a24" stroke-width="1"/></svg></div>`;
    return L.divIcon({ html, className: "", iconSize: [26, 26], iconAnchor: [13, 13] });
  }

  // ---------- Mise à jour des avions ----------
  // ---------- Filtres ----------
  const filters = { ground: true, low: true, mid: true, high: true, airlines: [], types: [] };

  function matches(ac) {
    if (followHex) return ac.hex === followHex;   // en mode suivi, on ne garde que cet avion
    const a = ac.alt_baro;
    if (a === "ground") {
      if (!filters.ground) return false;
    } else if (typeof a === "number") {
      const band = a < 10000 ? "low" : a < 25000 ? "mid" : "high";
      if (!filters[band]) return false;
    }
    if (filters.airlines.length) {
      const cs = (ac.flight || "").trim().toUpperCase();
      if (!filters.airlines.some((c) => cs.startsWith(c))) return false;
    }
    if (filters.types.length) {
      const t = (ac.t || "").toUpperCase();
      if (!filters.types.some((x) => t.startsWith(x))) return false;
    }
    return true;
  }

  function applyFilter(p) {
    const show = matches(p.ac);
    if (show && !map.hasLayer(p.marker)) p.marker.addTo(map);
    if (!show && map.hasLayer(p.marker)) p.marker.remove();
  }

  function countVisible() {
    let n = 0;
    for (const p of planes.values()) if (map.hasLayer(p.marker)) n++;
    return n;
  }

  const words = (text) => text.toUpperCase().split(/[\s,;]+/).filter(Boolean);

  // Noms de compagnies courantes → codes d’indicatif (liste non exhaustive, à compléter)
  const AIRLINES = {
    "transavia": ["TVF", "TRA"], "air france": ["AFR"], "hop": ["HOP"], "ryanair": ["RYR", "RUK"],
    "easyjet": ["EZY", "EJU", "EZS"], "vueling": ["VLG"], "lufthansa": ["DLH"], "british airways": ["BAW"],
    "klm": ["KLM"], "volotea": ["VOE"], "wizz air": ["WZZ", "WMT"], "iberia": ["IBE"], "air europa": ["AEA"],
    "tap": ["TAP"], "emirates": ["UAE"], "qatar": ["QTR"], "turkish": ["THY"], "norwegian": ["NAX", "NSZ"],
    "delta": ["DAL"], "united": ["UAL"], "american": ["AAL"], "air canada": ["ACA"], "swiss": ["SWR"],
    "brussels": ["BEL"], "austrian": ["AUA"], "sas": ["SAS"], "finnair": ["FIN"], "aer lingus": ["EIN"],
    "ita": ["ITY"], "jet2": ["EXS"], "tui": ["TUI", "TOM", "TUB"], "corsair": ["CRL"], "french bee": ["FBU"],
    "air caraibes": ["FWI"], "royal air maroc": ["RAM"], "tunisair": ["TAR"], "air algerie": ["DAH"],
    "etihad": ["ETD"], "air transat": ["TSC"], "fedex": ["FDX"], "ups": ["UPS"], "dhl": ["DHK", "BCS"]
  };

  const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

  const title = (k) => k.replace(/\b\w/g, (c) => c.toUpperCase());
  let airlineChoice = null;   // null = toutes les compagnies

  // Retrouve le nom de la compagnie à partir du début de l’indicatif (AFR1234 → Air France)
  function airlineFromCallsign(cs) {
    const code = (cs || "").slice(0, 3).toUpperCase();
    const key = Object.keys(AIRLINES).find((k) => AIRLINES[k].includes(code));
    return key ? title(key) : "";
  }

  function closeAir() {
    $("air-box").style.display = "none";
    $("air-btn").setAttribute("aria-expanded", "false");
  }

  function resetAirline() {
    airlineChoice = null;
    $("air-btn").textContent = "Toutes les compagnies ▾";
    closeAir();
  }

  function renderAirlineList() {
    const raw = $("air-q").value;
    const q = norm(raw);
    const list = $("air-list");
    list.textContent = "";
    const add = (label, choice) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      const selected = choice ? !!airlineChoice && airlineChoice.label === choice.label : !airlineChoice;
      btn.setAttribute("aria-selected", String(selected));
      btn.addEventListener("click", () => {
        airlineChoice = choice;
        $("air-btn").textContent = (choice ? choice.label : "Toutes les compagnies") + " ▾";
        closeAir();
        readFilters();
      });
      list.appendChild(btn);
    };
    if (!q) add("Toutes les compagnies", null);
    for (const k of Object.keys(AIRLINES).sort()) {
      if (!q || norm(k).includes(q)) add(title(k), { label: title(k), codes: AIRLINES[k] });
    }
    // Compagnie absente de la liste : on peut saisir son code à 3 ou 4 lettres
    const code = raw.trim().toUpperCase();
    if (/^[A-Z]{3,4}$/.test(code)) add("Utiliser le code " + code, { label: code, codes: [code] });
    if (!list.children.length) list.textContent = "Aucun résultat";
  }

  $("air-btn").addEventListener("click", () => {
    const open = $("air-box").style.display !== "block";
    if (!open) { closeAir(); return; }
    $("air-box").style.display = "block";
    $("air-btn").setAttribute("aria-expanded", "true");
    $("air-q").value = "";
    renderAirlineList();
    $("air-q").focus();
  });
  $("air-q").addEventListener("input", renderAirlineList);

  function readFilters() {
    for (const k of ["ground", "low", "mid", "high"]) filters[k] = $("flt-" + k).checked;
    filters.airlines = airlineChoice ? airlineChoice.codes : [];
    filters.types = words($("flt-type").value);
    for (const p of planes.values()) applyFilter(p);
    setStatus(`${countVisible()} sur ${planes.size} avions affichés`);
  }

  $("filters").addEventListener("input", readFilters);
  $("filters").addEventListener("change", readFilters);

  $("fbtn").addEventListener("click", () => {
    const open = $("filters").style.display !== "block";
    $("filters").style.display = open ? "block" : "none";
    $("fbtn").setAttribute("aria-expanded", open);
  });

  $("flt-reset").addEventListener("click", () => {
    for (const k of ["ground", "low", "mid", "high"]) $("flt-" + k).checked = true;
    resetAirline();
    $("flt-type").value = "";
    readFilters();
  });

  $("flt-pos").addEventListener("click", () => {
    if (!navigator.geolocation) { setStatus("Position non disponible sur cet appareil"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 9),
      () => setStatus("Position refusée : autorisez-la dans les réglages du navigateur")
    );
  });

  // Crée ou met à jour un avion sur la carte (renvoie false si sa position est inconnue)
  function upsert(ac) {
    if (typeof ac.lat !== "number" || typeof ac.lon !== "number") return false;
    const hex = ac.hex;
    const now = performance.now();
    const base = {
      lat: ac.lat, lon: ac.lon, gs: ac.gs, track: ac.track, ground: ac.alt_baro === "ground",
      t0: now - (typeof ac.seen_pos === "number" ? ac.seen_pos * 1000 : 0)
    };
    const start = estimate(base, now);
    let p = planes.get(hex);
    if (!p) {
      const marker = L.marker(start, { icon: planeIcon(ac) }).addTo(map);
      marker.on("click", () => select(hex));
      p = { marker, trail: [], ac, base, off: [0, 0] };
      planes.set(hex, p);
    } else {
      // On garde l’écart avec l’ancienne position affichée, qui se résorbe doucement
      const cur = p.marker.getLatLng();
      p.off = [cur.lat - start[0], cur.lng - start[1]];
      p.base = base;
      p.marker.setIcon(planeIcon(ac));
    }
    p.ac = ac;
    p.seen = Date.now();
    applyFilter(p);
    const el = p.marker.getElement();
    if (el) el.classList.toggle("sel", hex === selected);
    p.trail.push([ac.lat, ac.lon]);
    if (p.trail.length > 150) p.trail.shift();
    return true;
  }

  function updatePlanes(list) {
    const seen = new Set();
    for (const ac of list) {
      if (upsert(ac)) seen.add(ac.hex);
    }
    // Retire les avions qui ne sont plus dans la zone
    for (const [hex, p] of planes) {
      if (!seen.has(hex)) { p.marker.remove(); planes.delete(hex); }
    }
    showInfo();
  }

  // ---------- Fiche de l’avion sélectionné ----------
  function markSelected() {
    for (const [h, p] of planes) {
      const el = p.marker.getElement();
      if (el) el.classList.toggle("sel", h === selected);
    }
  }

  function select(hex) {
    selected = hex;
    markSelected();
    if (hex) sheetHidden = false;
    if (pendingRoute && hex) { startFollow(hex, true); return; }
    showInfo();
  }

  function showInfo() {
    const p = selected && planes.get(selected);
    $("chip").style.display = "none";
    if (!p) { $("info").style.display = "none"; trailLine.setLatLngs([]); return; }
    if (sheetHidden) {
      $("info").style.display = "none";
      if (followHex) {
        $("chip-text").textContent = "Suivi : " + ((p.ac.flight || "").trim() || p.ac.r || p.ac.hex);
        $("chip").style.display = "flex";
      }
      return;
    }
    const ac = p.ac;
    const cs = (ac.flight || "").trim();
    $("f-call").textContent = cs || ac.r || "Sans indicatif";
    $("f-sub").textContent = ac.ownOp || airlineFromCallsign(cs) || "";
    const alt = ac.alt_baro;
    const altText = alt === "ground" ? "Au sol"
      : typeof alt === "number" ? `${Math.round(alt * 0.3048).toLocaleString("fr-FR")} m (${alt.toLocaleString("fr-FR")} ft)` : "";
    const vr = ac.baro_rate;
    const vrText = typeof vr !== "number" ? ""
      : Math.abs(vr) < 300 ? "En palier"
      : `${vr > 0 ? "▲ Monte" : "▼ Descend"} (${Math.abs(Math.round(vr)).toLocaleString("fr-FR")} ft/min)`;
    const sq = ac.squawk;
    const sqText = !sq ? "" : sq + ({ "7500": " (détournement)", "7600": " (panne radio)", "7700": " (urgence)" }[sq] || "");
    const rows = [
      ["Appareil", ac.desc ? ac.desc + (ac.t ? ` (${ac.t})` : "") : ac.t],
      ["Immatriculation", ac.r],
      ["Altitude", altText],
      ["Vitesse sol", typeof ac.gs === "number" ? `${Math.round(ac.gs * 1.852)} km/h (${Math.round(ac.gs)} nœuds)` : ""],
      ["Vitesse verticale", vrText],
      ["Cap", typeof ac.track === "number" ? `${Math.round(ac.track)}°` : ""],
      ["Transpondeur", sqText],
      ["Code ICAO", (ac.hex || "").toUpperCase()],
      ["Dernier signal", typeof ac.seen === "number" ? `il y a ${Math.round(ac.seen)} s` : ""]
    ];
    const following = followHex && followHex === selected;
    for (const id of ["f-call", "f-sub", "f-list"]) $(id).style.display = following ? "none" : "";
    $("fc").style.display = following ? "block" : "none";
    if (following) fillFollowCard(ac, alt);
    const list = rows;
    $("f-follow").textContent = following ? "Arrêter le suivi" : "Suivre";
    $("f-center").style.display = following && !followCenter ? "inline-block" : "none";
    $("f-center").textContent = routeMode && followRoute ? "Tout l’itinéraire" : "Recentrer";
    const dl = $("f-list");
    dl.textContent = "";
    for (const [label, value] of list) {
      if (!value) continue;
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value;
      dl.append(dt, dd);
    }
    $("info").style.display = "block";
    trailLine.setLatLngs(p.trail);
  }

  $("close").addEventListener("click", () => {
    if (followHex) { sheetHidden = true; showInfo(); }   // le suivi continue, seule la fiche se ferme
    else select(null);
  });
  map.on("click", () => { if (!followHex) select(null); });

  // ---------- Chargement des données ----------
  const cooldown = {};      // source -> heure jusqu’à laquelle on la laisse tranquille
  let failStreak = 0;       // échecs d’affilée : le rythme de chargement ralentit
  const coolDown = (idx, ms) => { cooldown[idx] = Date.now() + ms; };
  const isCooling = (idx) => (cooldown[idx] || 0) > Date.now();

  async function refresh() {
    if (busy) return;
    busy = true;
    if (followHex) { await refreshFollowed(); busy = false; return; }
    if (regionTiles().length) { await refreshRegions(); busy = false; return; }
    const rc = map.getCenter().wrap();
    // Centre arrondi : des requêtes identiques d’un déplacement à l’autre, donc moins de charge pour les serveurs
    const la = (Math.round(rc.lat * 4) / 4).toFixed(2), lo = (Math.round(rc.lng * 4) / 4).toFixed(2);
    let nm = Math.ceil(L.latLng(+la, +lo).distanceTo(map.getBounds().getNorthEast()) / 1852 / 25) * 25;
    const tooWide = nm > MAX_NM;
    nm = Math.min(nm, MAX_NM);
    const errors = [];
    let ok = false, tried = 0;
    for (let i = 0; i < PROVIDERS.length && !ok; i++) {
      const idx = (current + i) % PROVIDERS.length;
      if (isCooling(idx)) continue;   // source mise au repos après un refus
      tried++;
      const prov = PROVIDERS[idx];
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const target = prov.url(la, lo, nm);
        const res = await fetch(PROXY ? PROXY + "?u=" + encodeURIComponent(target) : target, { signal: ctrl.signal });
        if (!res.ok) throw new Error("code " + res.status);
        const data = await res.json();
        updatePlanes(prov.parse ? prov.parse(data) : (data.ac || data.aircraft || []));
        current = idx;
        ok = true;
        setStatus(`${countVisible()} sur ${planes.size} avions (${prov.name})` + (tooWide ? ", zoomez pour voir toute la zone" : ""));
      } catch (err) {
        errors.push(prov.name + " : " + err.message);
        coolDown(idx, /code (429|403)/.test(err.message) ? 60000 : 20000);
      }
      clearTimeout(timer);
    }
    if (ok) {
      failStreak = 0;
    } else {
      failStreak++;
      const codes = errors.map((e) => (e.match(/code (\d+)/) || [])[1] || "délai").join("/");
      setStatus(tried ? `Serveurs de données saturés (${codes}), nouvel essai automatique`
                      : "Pause pour respecter les limites des serveurs, nouvel essai bientôt");
    }
    busy = false;
  }

  // ---------- Mouvement fluide ----------
  // Entre deux mises à jour, on estime la position d’après la vitesse et le cap
  function estimate(b, now) {
    const ms = Math.min(Math.max(now - b.t0, 0), 60000);
    if (!b.gs || b.ground || typeof b.track !== "number") return [b.lat, b.lon];
    const d = b.gs * 0.514444 * (ms / 1000);            // distance parcourue en mètres
    const rad = (b.track * Math.PI) / 180;
    const dLat = (d * Math.cos(rad)) / 111320;
    const dLon = (d * Math.sin(rad)) / (111320 * Math.max(Math.cos((b.lat * Math.PI) / 180), 0.01));
    return [b.lat + dLat, b.lon + dLon];
  }

  let lastTick = performance.now();
  let frameN = 0;
  function step() {
    const now = performance.now();
    const k = Math.exp(-(now - lastTick) / 1000);       // résorbe l’écart de correction
    lastTick = now;
    for (const p of planes.values()) {
      if (!map.hasLayer(p.marker)) continue;
      const e = estimate(p.base, now);
      p.off[0] *= k;
      p.off[1] *= k;
      p.marker.setLatLng([e[0] + p.off[0], e[1] + p.off[1]]);
    }
    const sp = planes.get(followHex || selected);
    if (sp) {
      const c = sp.marker.getLatLng();
      // En vue Itinéraire, la ligne violette remplace la trace jaune (qui ne montre que le chemin depuis l’ouverture de la page)
      const drawNow = !followHex || ++frameN % 6 === 0;   // en suivi (60 images/s), les lignes sont redessinées moins souvent
      if (drawNow) trailLine.setLatLngs(routeMode && followRoute ? [] : followTrace && followHex ? [...followTrace, [c.lat, c.lng]] : [...sp.trail, [c.lat, c.lng]]);
      if (followHex && followCenter) map.panTo(c, { animate: false });
      if (drawNow) updateRouteLines();
    }
  }
  // Carte normale : 10 mises à jour par seconde. Suivi : 60 images par seconde pour un mouvement fluide comme un GPS
  setInterval(() => { if (!followHex) step(); }, 100);
  requestAnimationFrame(function loop() { if (followHex) step(); requestAnimationFrame(loop); });

  // ---------- Suivi et itinéraire ----------
  let followHex = null, routeMode = false, followCenter = true, pendingRoute = false;
  let followStart = 0, followRoute = null, wasAirborne = false, landed = false;
  let sheetHidden = false, routeError = "", routePast = null, routeFuture = null;
  let followTrace = null, followTakeoff = null, followLanding = null, lastTraceAt = 0, avgGs = 0;
  let routeSource = "", traceStatus = "pas encore chargé";
  const routeLayer = L.layerGroup().addTo(map);

  const distKm = (a, b) => {
    const r = Math.PI / 180;
    const h = Math.sin(((b[0] - a[0]) * r) / 2) ** 2 +
      Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(((b[1] - a[1]) * r) / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  };

  // Points d’une ligne droite « sur la sphère » entre deux aéroports (trajet théorique)
  function greatCircle(a, b, n = 64) {
    const r = Math.PI / 180, deg = 180 / Math.PI;
    const [la1, lo1, la2, lo2] = [a[0] * r, a[1] * r, b[0] * r, b[1] * r];
    const d = distKm(a, b) / 6371;
    if (!d) return [a];
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
      const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
      const z = A * Math.sin(la1) + B * Math.sin(la2);
      pts.push([Math.atan2(z, Math.sqrt(x * x + y * y)) * deg, Math.atan2(y, x) * deg]);
    }
    return pts;
  }

  const relayFetch = (url, init) => fetch(PROXY ? PROXY + "?u=" + encodeURIComponent(url) : url, init);

  // Convertit la réponse adsb.lol (liste d’aéroports) vers notre format, en choisissant le tronçon où se trouve l’avion
  function fromRouteset(e, ac) {
    const aps = e && e._airports;
    if (!Array.isArray(aps) || aps.length < 2) return null;
    const pos = [ac.lat, ac.lon];
    let best = null, bestDetour = Infinity;
    for (let i = 0; i < aps.length - 1; i++) {
      const a = aps[i], b = aps[i + 1];
      if (typeof a.lat !== "number" || typeof a.lon !== "number" || typeof b.lat !== "number" || typeof b.lon !== "number") continue;
      const detour = distKm([a.lat, a.lon], pos) + distKm(pos, [b.lat, b.lon]) - distKm([a.lat, a.lon], [b.lat, b.lon]);
      if (detour < bestDetour) { best = [a, b]; bestDetour = detour; }
    }
    if (!best) return null;
    const conv = (x) => ({ iata_code: x.iata, icao_code: x.icao, municipality: x.location, name: x.name, latitude: x.lat, longitude: x.lon });
    return { callsign_iata: "", airline: null, origin: conv(best[0]), destination: conv(best[1]) };
  }

  // Départ et arrivée d’un vol : on essaie adsbdb, puis adsb.lol si le vol est absent
  async function getRoute(cs, ac) {
    routeError = ""; routeSource = "";
    if (!cs) { routeError = "vol sans indicatif"; return null; }
    try {
      const res = await relayFetch("https://api.adsbdb.com/v0/callsign/" + encodeURIComponent(cs));
      if (res.ok) {
        const fr = (await res.json()).response?.flightroute;
        if (fr && fr.origin && fr.destination) { routeSource = "adsbdb"; return fr; }
        routeError = "adsbdb incomplet";
      } else {
        routeError = res.status === 400 ? "relais non mis à jour" : res.status === 404 ? "absent de adsbdb" : "adsbdb code " + res.status;
      }
    } catch (err) { routeError = "adsbdb injoignable"; }
    try {
      const res = await relayFetch("https://api.adsb.lol/api/0/routeset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ planes: [{ callsign: cs, lat: ac.lat, lng: ac.lon }] })
      });
      if (res.ok) {
        const list = await res.json();
        const r = fromRouteset(Array.isArray(list) ? list[0] : null, ac);
        if (r) { routeSource = "adsb.lol"; routeError = ""; return r; }
        routeError += " ; absent de adsb.lol";
      } else {
        routeError += " ; adsb.lol code " + res.status;
      }
    } catch (err) { routeError += " ; adsb.lol injoignable"; }
    return null;
  }

  const hm = (min) => {
    const m = Math.max(0, Math.round(min));
    return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  };

  // Fiche de suivi (style Flightradar24)
  function fillFollowCard(ac, alt) {
    const r = followRoute;
    const cs = (ac.flight || "").trim();
    const show = (id, text) => { $(id).textContent = text || ""; $(id).style.display = text ? "" : "none"; };
    $("fc-call").textContent = cs || ac.r || "—";
    show("fc-iata", r && r.callsign_iata);
    show("fc-type", ac.t);
    $("fc-air").textContent = (r && r.airline && r.airline.name) || ac.ownOp || airlineFromCallsign(cs) || "";
    $("fc-o").textContent = r ? (r.origin.iata_code || r.origin.icao_code || "—") : "—";
    $("fc-on").textContent = r ? (r.origin.municipality || r.origin.name || "") : "";
    $("fc-d").textContent = r ? (r.destination.iata_code || r.destination.icao_code || "—") : "—";
    $("fc-dn").textContent = r ? (r.destination.municipality || r.destination.name || "") : "";

    const gs = typeof ac.gs === "number" ? ac.gs : 0;
    const speed = avgGs > 0 ? avgGs : gs;   // vitesse moyenne récente : estimation plus stable
    const clock = (t) => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    let pct = 0, since = "N/A", eta = "N/A";
    if (followTakeoff && !landed) since = hm((Date.now() - followTakeoff) / 60000);   // heure réelle de décollage
    if (r) {
      const here = [ac.lat, ac.lon];
      const flown = distKm([r.origin.latitude, r.origin.longitude], here);
      const left = distKm(here, [r.destination.latitude, r.destination.longitude]);
      pct = flown + left > 0 ? Math.round((100 * flown) / (flown + left)) : 0;
      if (landed) pct = 100;
      if (!landed && alt !== "ground" && speed >= 100) {
        eta = hm((left / (speed * 1.852)) * 60);
        if (!followTakeoff && speed >= 200) since = "≈ " + hm((flown / (speed * 1.852)) * 60);   // estimation
      }
    }
    $("fc-fill").style.width = pct + "%";
    $("fc-since").textContent = landed && followTakeoff && followLanding
      ? "Durée du vol " + hm((followLanding - followTakeoff) / 60000)
      : "Décoll. il y a " + since;
    $("fc-eta").textContent = landed ? "Atterri" + (followLanding ? " à " + clock(followLanding) : " ✔")
      : r ? "Arrivée dans " + eta : "Trajet indisponible : " + routeError;
    $("fc-alt").textContent = alt === "ground" ? "Au sol" : typeof alt === "number" ? alt.toLocaleString("fr-FR") + " ft" : "N/A";
    $("fc-spd").textContent = gs ? Math.round(gs) + " kts" : "N/A";
    $("fc-model").textContent = ac.desc || ac.t || "";
    $("fc-reg").textContent = ac.r ? "IMM. " + ac.r : "";
    $("fc-diag").textContent = "Trajet : " + (r ? routeSource : routeError) + " · Historique : " + traceStatus;
  }

  function refilter() { for (const p of planes.values()) applyFilter(p); }

  function updateTabs() {
    $("tab-map").setAttribute("aria-pressed", String(!followHex && !pendingRoute));
    $("tab-route").setAttribute("aria-pressed", String(routeMode || pendingRoute));
  }

  function drawRoute() {
    routeLayer.clearLayers();
    const r = followRoute, p = planes.get(followHex);
    if (!r || !p) return;
    const a = [r.origin.latitude, r.origin.longitude], b = [r.destination.latitude, r.destination.longitude];
    routePast = L.polyline([], { color: "#8a5cf6", weight: 3 }).addTo(routeLayer);
    routeFuture = L.polyline([], { color: "#8a5cf6", weight: 2, dashArray: "6 8", opacity: 0.7 }).addTo(routeLayer);
    for (const [pt, ap] of [[a, r.origin], [b, r.destination]]) {
      const name = (ap.municipality || ap.name || "").toUpperCase();
      L.circleMarker(pt, { radius: 6, color: "#0e1a24", weight: 2, fillColor: "#fff", fillOpacity: 1 })
        .bindTooltip(`${name} (${ap.iata_code || ap.icao_code || ""})`, { permanent: true, direction: "top" })
        .addTo(routeLayer);
    }
    updateRouteLines();
    map.fitBounds(L.latLngBounds([a, b, p.marker.getLatLng()]), { padding: [50, 50] });
  }

  function updateRouteLines() {
    const r = followRoute, p = planes.get(followHex);
    if (!routeMode || !r || !p || !routePast) return;
    const c = p.marker.getLatLng(), cur = [c.lat, c.lng];
    routePast.setLatLngs(followTrace ? [...followTrace, cur] : greatCircle([r.origin.latitude, r.origin.longitude], cur, 48));
    routeFuture.setLatLngs(greatCircle(cur, [r.destination.latitude, r.destination.longitude], 48));
  }

  async function startFollow(hex, withRoute) {
    const p = planes.get(hex);
    if (!p) return;
    followHex = hex; selected = hex; sheetHidden = false; routeMode = withRoute; followCenter = !withRoute; pendingRoute = false;
    followStart = Date.now(); followRoute = null; wasAirborne = false; landed = false;
    followTrace = null; followTakeoff = null; followLanding = null; lastTraceAt = Date.now(); avgGs = 0;
    routeLayer.clearLayers();
    loadTrace(hex); saveFollow(hex, withRoute);
    refilter(); updateTabs(); showInfo();
    setStatus("Suivi en direct");
    const route = await getRoute((p.ac.flight || "").trim(), p.ac);
    if (followHex !== hex) return;
    followRoute = route;
    if (withRoute) {
      if (route) drawRoute(); else followCenter = true;   // pas d’itinéraire connu : on suit simplement l’avion
    }
    showInfo();
  }

  function stopFollow() {
    followHex = null; routeMode = false; pendingRoute = false; followRoute = null; followCenter = true;
    followTrace = null; forgetFollow();
    routeLayer.clearLayers();
    routePast = routeFuture = null; sheetHidden = false;
    refilter(); updateTabs(); showInfo(); refresh();
  }

  // En suivi, on interroge directement cet avion (même s’il sort de l’écran)
  async function refreshFollowed() {
    for (const base of SEARCH_SOURCES) {
      try {
        const found = await fetchAircraft(`${base}/hex/${followHex}`);
        if (found.length) {
          const ac = found[0];
          upsert(ac);
          if (typeof ac.alt_baro === "number" && ac.alt_baro > 100) wasAirborne = true;
          if (wasAirborne && ac.alt_baro === "ground") { landed = true; forgetFollow(); }
          if (typeof ac.gs === "number" && ac.gs > 100) avgGs = avgGs ? avgGs * 0.8 + ac.gs * 0.2 : ac.gs;
          if (Date.now() - lastTraceAt > 60000) { lastTraceAt = Date.now(); loadTrace(followHex); }
          showInfo();
          setStatus(landed ? "Atterri" : "Suivi en direct");
          return;
        }
      } catch (err) { /* source suivante */ }
    }
    setStatus("Signal perdu, nouvelle tentative…");
  }

  $("f-follow").addEventListener("click", () => {
    if (followHex && followHex === selected) stopFollow(); else if (selected) startFollow(selected, false);
  });
  $("chip-open").addEventListener("click", () => { sheetHidden = false; showInfo(); });
  $("chip-stop").addEventListener("click", () => stopFollow());
  $("f-center").addEventListener("click", () => {
    if (routeMode && followRoute) drawRoute(); else { followCenter = true; showInfo(); }
  });
  map.on("dragstart", () => { if (followHex) { followCenter = false; showInfo(); } });

  $("tab-map").addEventListener("click", () => { if (followHex || pendingRoute) stopFollow(); });
  $("tab-route").addEventListener("click", () => {
    if (routeMode) return;
    if (selected && planes.get(selected)) { startFollow(selected, true); return; }
    pendingRoute = true;
    updateTabs();
    setStatus("Touchez un avion pour voir son itinéraire");
  });

  // Trajet réel déjà parcouru + heures réelles de décollage et d’atterrissage (historique adsb.lol)
  async function loadTrace(hex) {
    try {
      const url = `https://adsb.lol/data/traces/${hex.slice(-2)}/trace_full_${hex}.json`;
      const res = await relayFetch(url);
      if (!res.ok) { traceStatus = res.status === 400 ? "relais non mis à jour" : "indisponible (code " + res.status + ")"; return; }
      const data = await res.json();
      const pts = data.trace || [];
      let end = pts.length;
      while (end > 0 && pts[end - 1][3] === "ground") end--;      // ignore la fin au sol (avion posé)
      let start = end;
      while (start > 0 && pts[start - 1][3] !== "ground") start--; // remonte jusqu’au décollage
      const leg = pts.slice(start, end).filter((q) => typeof q[1] === "number");
      if (followHex !== hex) return;
      if (leg.length < 2) { traceStatus = "pas assez de points"; return; }
      const step = Math.max(1, Math.floor(leg.length / 600));
      followTrace = leg.filter((_, i) => i % step === 0 || i === leg.length - 1).map((q) => [q[1], q[2]]);
      followTakeoff = start > 0 ? (data.timestamp + pts[start][0]) * 1000 : null;
      followLanding = end < pts.length ? (data.timestamp + pts[end][0]) * 1000 : null;
      traceStatus = "ok";
    } catch (err) { traceStatus = "connexion impossible"; }
  }

  // Le suivi est mémorisé : en rouvrant le site, il reprend jusqu’à l’atterrissage
  function saveFollow(hex, route) {
    try { localStorage.setItem("radar-suivi", JSON.stringify({ hex, route })); } catch (err) {}
  }
  function forgetFollow() {
    try { localStorage.removeItem("radar-suivi"); } catch (err) {}
  }

  async function loadByHex(hex) {
    for (const base of SEARCH_SOURCES) {
      try {
        const found = await fetchAircraft(`${base}/hex/${hex.toLowerCase()}`);
        if (found.length) return found[0];
      } catch (err) { /* source suivante */ }
    }
    return null;
  }

  async function resumeFollow() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("radar-suivi")); } catch (err) {}
    if (!saved || !saved.hex) return false;
    const ac = await loadByHex(saved.hex);
    if (!ac) { forgetFollow(); return false; }
    upsert(ac);
    map.setView([ac.lat, ac.lon], 8);
    startFollow(ac.hex, !!saved.route);
    return true;
  }

  // ---------- Recherche par vol ou immatriculation ----------
  // Sources qui savent chercher un avion précis (adresses non vérifiées d’ici)
  const SEARCH_SOURCES = ["https://api.adsb.lol/v2", "https://api.airplanes.live/v2"];

  async function fetchAircraft(url) {
    const res = await fetch(PROXY ? PROXY + "?u=" + encodeURIComponent(url) : url);
    if (!res.ok) throw new Error("code " + res.status);
    const data = await res.json();
    return (data.ac || data.aircraft || []).filter((a) => typeof a.lat === "number" && typeof a.lon === "number");
  }

  async function search() {
    const q = $("q").value.trim().toUpperCase().replace(/\s+/g, "");
    if (!q) return;
    setStatus("Recherche de " + q + "…");
    const code = encodeURIComponent(q);
    for (const base of SEARCH_SOURCES) {
      for (const kind of ["callsign", "reg"]) {
        try {
          const found = await fetchAircraft(`${base}/${kind}/${code}`);
          if (found.length) {
            const ac = found[0];
            upsert(ac);
            map.setView([ac.lat, ac.lon], 9);
            select(ac.hex);
            setStatus("Trouvé : " + ((ac.flight || "").trim() || ac.r || ac.hex));
            return;
          }
        } catch (err) { /* on essaie la source suivante */ }
      }
    }
    setStatus("Aucun avion en vol trouvé pour « " + q + " »");
  }

  $("go").addEventListener("click", search);
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

  // ---------- Fonds de carte et radar météo ----------
  const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Imagery © Esri", maxZoom: 18
  });
  const radarGroup = L.layerGroup();
  L.control.layers({ "Plan": osm, "Satellite": satellite }, { "Météo (radar)": radarGroup },
    { position: "topleft", collapsed: true }).addTo(map);

  // Radar RainViewer : dernière image disponible (gratuit, limité au zoom 7, au-delà l’image est agrandie)
  let radarTimer = null;
  async function loadRadar() {
    try {
      const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
      if (!res.ok) throw new Error("code " + res.status);
      const data = await res.json();
      const frames = data.radar && data.radar.past;
      if (!frames || !frames.length) throw new Error("aucune image");
      const last = frames[frames.length - 1];
      radarGroup.clearLayers();
      L.tileLayer(`${data.host}${last.path}/256/{z}/{x}/{y}/2/1_1.png`, {
        opacity: 0.65, maxNativeZoom: 7, maxZoom: 18, attribution: "Radar © RainViewer"
      }).addTo(radarGroup);
    } catch (err) {
      setStatus("Radar météo indisponible");
    }
  }
  map.on("overlayadd", (e) => {
    if (e.layer === radarGroup) { loadRadar(); radarTimer = setInterval(loadRadar, 10 * 60 * 1000); }
  });
  map.on("overlayremove", (e) => {
    if (e.layer === radarGroup) { clearInterval(radarTimer); radarGroup.clearLayers(); }
  });

  // ---------- Partager ----------
  $("f-share").addEventListener("click", async () => {
    const p = selected && planes.get(selected);
    if (!p) return;
    const name = (p.ac.flight || "").trim() || p.ac.r || p.ac.hex;
    const url = location.origin + location.pathname + "#vol=" + p.ac.hex;
    try {
      if (navigator.share) await navigator.share({ title: "Radar de vols", text: "Suivez le vol " + name + " en direct", url });
      else { await navigator.clipboard.writeText(url); setStatus("Lien copié"); }
    } catch (err) { /* partage annulé */ }
  });

  // Ouverture d’un lien partagé : le site s’ouvre sur l’avion concerné
  async function openSharedFlight() {
    const m = location.hash.match(/^#vol=([0-9a-fA-F]{6})$/);
    if (!m) return false;
    setStatus("Recherche du vol partagé…");
    for (const base of SEARCH_SOURCES) {
      try {
        const found = await fetchAircraft(`${base}/hex/${m[1].toLowerCase()}`);
        if (found.length) {
          const ac = found[0];
          upsert(ac);
          map.setView([ac.lat, ac.lon], 8);
          select(ac.hex);
          return true;
        }
      } catch (err) { /* source suivante */ }
    }
    setStatus("Ce vol n’est plus en vol ou n’est pas capté");
    return false;
  }

  // ---------- Régions ----------
  // L’API gratuite ne donne que 250 milles nautiques autour d’un point : chaque région est donc
  // couverte par des « zones » placées sur ses grands aéroports (pas par tout le continent).
  const REGIONS = {
    france: { nom: "France", pts: [[48.85, 2.35], [45.75, 4.85], [43.6, 1.4], [48.1, -1.7]] },
    europe: { nom: "Europe", pts: [[51.5, -0.1], [48.8, 2.4], [52.3, 4.8], [50.0, 8.6], [40.4, -3.7], [45.5, 9.2], [41.9, 12.5], [48.2, 16.4], [52.2, 21.0], [37.9, 23.7], [41.0, 29.0], [59.6, 17.9]] },
    namerique: { nom: "Amérique du Nord", pts: [[40.7, -74.0], [41.9, -87.9], [33.6, -84.4], [32.9, -97.0], [34.0, -118.4], [39.8, -104.7], [25.8, -80.3], [43.7, -79.6], [47.4, -122.3]] },
    samerique: { nom: "Amérique du Sud", pts: [[-23.4, -46.5], [-34.8, -58.5], [4.7, -74.1], [-12.0, -77.1], [-33.4, -70.8]] },
    moyenorient: { nom: "Moyen-Orient", pts: [[30.0, 31.4], [25.2, 55.3], [25.3, 51.6], [24.9, 46.7], [33.4, -7.6]] },
    afrique: { nom: "Afrique", pts: [[-26.1, 28.2], [6.6, 3.3], [-1.3, 36.9], [9.0, 38.8], [-34.0, 18.6]] },
    asie: { nom: "Asie", pts: [[35.6, 139.7], [37.5, 126.5], [40.1, 116.6], [31.1, 121.8], [22.3, 113.9], [1.4, 103.9], [13.7, 100.7], [28.6, 77.1], [19.1, 72.9]] },
    oceanie: { nom: "Océanie", pts: [[-33.9, 151.2], [-37.7, 144.8], [-27.4, 153.1], [-31.9, 115.9], [-37.0, 174.8]] }
  };
  const MAX_TILES = 12;
  let selectedRegions = new Set();

  function regionTiles() {
    const pts = [];
    for (const k of selectedRegions) pts.push(...REGIONS[k].pts);
    return pts.slice(0, MAX_TILES);
  }

  // Charge une zone en essayant les sources dans l’ordre
  async function fetchTile(la, lo) {
    for (let i = 0; i < PROVIDERS.length; i++) {
      const idx = (current + i) % PROVIDERS.length;
      if (isCooling(idx)) continue;
      const prov = PROVIDERS[idx];
      try {
        const res = await relayFetch(prov.url(la, lo, 250));
        if (!res.ok) { coolDown(idx, res.status === 429 || res.status === 403 ? 60000 : 20000); continue; }
        const data = await res.json();
        current = idx;
        return prov.parse ? prov.parse(data) : (data.ac || data.aircraft || []);
      } catch (err) { /* source suivante */ }
    }
    return null;
  }

  // Pour ne pas saturer les serveurs gratuits, on ne charge que 4 zones à la fois, à tour de rôle
  let tileCursor = 0;
  async function refreshRegions() {
    const all = regionTiles();
    const BATCH = 4;
    const batch = [];
    for (let i = 0; i < Math.min(BATCH, all.length); i++) batch.push(all[(tileCursor + i) % all.length]);
    tileCursor = (tileCursor + BATCH) % all.length;
    const results = await Promise.all(batch.map(([la, lo]) => fetchTile(la.toFixed(3), lo.toFixed(3))));
    const ok = results.filter(Boolean);
    if (!ok.length) {
      failStreak++;
      setStatus("Serveurs de données saturés, nouvel essai automatique");
      return;
    }
    failStreak = 0;
    const byHex = new Map();
    for (const list of ok) for (const ac of list) if (typeof ac.lat === "number" && typeof ac.lon === "number") byHex.set(ac.hex, ac);
    for (const ac of byHex.values()) upsert(ac);
    // On retire un avion seulement s’il n’a pas été revu depuis 90 secondes
    for (const [hex, p] of planes) if (Date.now() - p.seen > 90000) { p.marker.remove(); planes.delete(hex); }
    showInfo();
    setStatus(`${countVisible()} sur ${planes.size} avions (${all.length} zones, mises à jour par lots)`);
  }

  const regList = $("reg-list");
  for (const [key, r] of Object.entries(REGIONS)) {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.value = key;
    label.append(box, " " + r.nom);
    regList.appendChild(label);
  }
  regList.addEventListener("change", () => {
    selectedRegions = new Set([...regList.querySelectorAll("input:checked")].map((b) => b.value));
    const tiles = regionTiles();
    if (tiles.length) map.fitBounds(L.latLngBounds(tiles).pad(0.3));
    refresh();
  });

  // Attend 1,5 s après la fin du déplacement de la carte avant de recharger
  let moveTimer = null;
  map.on("moveend", () => { clearTimeout(moveTimer); moveTimer = setTimeout(() => { if (!regionTiles().length) refresh(); }, 1500); });
  (function loop() {
    setTimeout(async () => { await refresh(); loop(); }, (followHex ? 4000 : regionTiles().length ? 10000 : REFRESH_MS) * Math.min(1 + failStreak, 4));
  })();
  openSharedFlight()
    .then((ok) => ok || resumeFollow())
    .then((ok) => { if (!ok) refresh(); });
</script>
</body>
</html>
